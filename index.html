<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>لیدربرد روبی</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, "Vazirmatn", system-ui, sans-serif;
    background: #14110f; color: #f5ece4;
    min-height: 100vh; padding: 16px 14px 32px;
  }
  header { text-align: center; padding: 10px 0 18px; }
  header h1 { font-size: 22px; color: #ff9a3c; }
  header p { font-size: 13px; color: #b9a99a; margin-top: 6px; }
  ol { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 12px;
    background: #211b17; border: 1px solid #2f2721;
    border-radius: 14px; padding: 12px 14px;
  }
  li.top1 { background: #3a2a12; border-color: #ffb347; }
  li.top2 { background: #2c2a2a; border-color: #c0c0c0; }
  li.top3 { background: #33231a; border-color: #cd7f32; }
  .rank { width: 34px; text-align: center; font-weight: 700; font-size: 16px; }
  .name { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .value { font-weight: 700; color: #ffb347; font-size: 15px; }
  .msg { text-align: center; color: #b9a99a; padding: 40px 10px; line-height: 2; }
  button {
    margin-top: 14px; padding: 10px 22px; border: 0; border-radius: 12px;
    background: #ff9a3c; color: #1b1410; font-size: 14px; font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>🏆 لیدربرد روب‌پوینت</h1>
  <p>بیشترین روب‌پوینت کسب‌شده</p>
</header>
<ol id="list"></ol>
<div id="msg" class="msg">🦊 در حال بارگذاری...</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var initData = tg ? tg.initData : "";
  var list = document.getElementById("list");
  var msg = document.getElementById("msg");

  function fa(n) { return Number(n || 0).toLocaleString("fa-IR"); }

  function showMsg(text, withRetry) {
    list.innerHTML = "";
    msg.style.display = "block";
    msg.textContent = text;
    if (withRetry) {
      var b = document.createElement("button");
      b.textContent = "دوباره امتحان کن";
      b.onclick = load;
      msg.appendChild(document.createElement("br"));
      msg.appendChild(b);
    }
  }

  function load() {
    showMsg("🦊 در حال بارگذاری...");
    if (!initData) {
      showMsg("این صفحه فقط داخل تلگرام کار می‌کنه. از دکمه‌ی منوی بات بازش کن.");
      return;
    }
    fetch("/api/leaderboard?category=points", { headers: { "X-Init-Data": initData } })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          if (!res.ok) throw new Error((body.detail || "خطا") + " (کد " + res.status + ")");
          return body;
        });
      })
      .then(function (data) {
        if (!data.entries || !data.entries.length) {
          showMsg("هنوز کسی توی لیدربرد نیست.");
          return;
        }
        msg.style.display = "none";
        list.innerHTML = "";
        data.entries.forEach(function (e) {
          var li = document.createElement("li");
          if (e.rank === 1) li.className = "top1";
          else if (e.rank === 2) li.className = "top2";
          else if (e.rank === 3) li.className = "top3";
          var medal = e.rank === 1 ? "🥇" : e.rank === 2 ? "🥈" : e.rank === 3 ? "🥉" : fa(e.rank);
          var r = document.createElement("span"); r.className = "rank"; r.textContent = medal;
          var n = document.createElement("span"); n.className = "name"; n.textContent = e.name;
          var v = document.createElement("span"); v.className = "value"; v.textContent = fa(e.value) + " 💰";
          li.appendChild(r); li.appendChild(n); li.appendChild(v);
          list.appendChild(li);
        });
      })
      .catch(function (err) {
        showMsg("نتونستم لیدربرد رو بگیرم: " + err.message, true);
      });
  }

  load();
})();
</script>
</body>
</html>
