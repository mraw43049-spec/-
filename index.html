<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>روبی 🦊</title>
<meta name="theme-color" content="#07140f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js" defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050d18;color:#f1fff6;font-family:Tahoma,Vazirmatn,system-ui,sans-serif;min-height:100vh;padding:14px 12px 170px}
header{text-align:center;padding:6px 0 12px}h1{font-size:23px;margin:0;color:#ffc46b;text-shadow:0 0 18px #3be0a0}
.view{display:none}.view.active{display:block}
.card{background:linear-gradient(160deg,#143a2bcc,#0b2219cc);border:1px solid #4c9a73;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 8px 22px #0007,inset 0 1px 0 #ffffff14}
.hero{text-align:center}
.fox-img{width:200px;height:200px;max-width:70vw;max-height:70vw;margin:0 auto 12px;border-radius:24px;background:#12301f;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:96px;position:relative}
.fox-img.has-img{width:min(92%,380px);height:auto;max-width:none;max-height:none;background:#0a1d15;cursor:zoom-in}
.fox-img img{width:100%;height:auto;max-height:68vh;object-fit:contain;display:block}
.zoom-hint{position:absolute;bottom:8px;left:8px;background:#000a;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;pointer-events:none}
.lightbox{position:fixed;inset:0;background:#000e;display:none;z-index:50;touch-action:none;overflow:hidden}
.lightbox.open{display:block}
.lightbox img{position:absolute;top:50%;left:50%;max-width:96vw;max-height:90vh;transform-origin:center center;user-select:none;-webkit-user-drag:none;will-change:transform}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:22px}
.lb-tip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:12px;pointer-events:none}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:60;border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.8;text-align:center;font-weight:700;box-shadow:0 8px 24px #000a;transform:translateY(-140%);transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translateY(0)}
.toast.ok{background:#1d3322;border:1px solid #3c7a4a;color:#d8ffe0}
.toast.err{background:#3a1b1b;border:1px solid #7a3030;color:#ffd9d9}
#rfIcon{display:inline-block}
.refresh-tab.spin #rfIcon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1e4a37;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffb347;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.podium{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;align-items:end;direction:ltr;margin-bottom:12px}
.pod{background:#0a1d15;border:1px solid #2a5c45;border-radius:18px;padding:12px 6px;text-align:center;direction:rtl;min-width:0}
.pod.me{border-color:#ff9a3c;background:#1d4a35}
.pod .avatar{margin:0 auto 6px}
.pod.p1{padding-top:16px;border-color:#e0b43c;background:linear-gradient(#1b3a2a,#0a1d15)}
.pod.p1 .avatar{width:84px;height:84px;font-size:32px;box-shadow:0 0 0 3px #e0b43c}
.pod.p2 .avatar{width:64px;height:64px;font-size:24px;box-shadow:0 0 0 3px #b8c0c8}
.pod.p3 .avatar{width:58px;height:58px;font-size:22px;box-shadow:0 0 0 3px #c88a54}
.pod .medal{font-size:22px}.pod.p1 .medal{font-size:30px}
.pod .pname{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.pod.p1 .pname{font-size:14px}
.pod .pval{font-weight:900;color:#ffb347;font-size:13px;margin-top:3px}
.pod.p1 .pval{font-size:16px}
.chat-box{height:calc(100vh - 250px);min-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.cmsg{display:flex;gap:8px;align-items:flex-end}
.cmsg .avatar{width:34px;height:34px;font-size:14px}
.cbub{background:#0a1d15;border:1px solid #2a5c45;border-radius:16px 16px 16px 4px;padding:8px 11px;max-width:78%;word-break:break-word}
.cmsg.me{flex-direction:row-reverse}
.cmsg.me .cbub{background:#1f5a43;border-color:#ff9a3c66;border-radius:16px 16px 4px 16px}
.cname{font-size:11px;color:#ffb347;font-weight:800;margin-bottom:2px}
.ctext{font-size:14px;line-height:1.8;white-space:pre-wrap}
.ctime{font-size:10px;color:#7fb39a;margin-top:2px}
.atk{border-color:#ff6b6b!important;background:linear-gradient(160deg,#4a1d2dcc,#0b2219cc)!important}
.atk h3{margin:0 0 6px;font-size:16px;color:#ffb3b3}
.atk .timer{font-weight:900;color:#ffd27a;font-size:15px}
.atk-btns{display:grid;gap:8px;margin-top:10px}
.atk-btns button{padding:12px;border-radius:14px;border:1px solid #4c9a73;background:#153a2b;color:#fff;font-weight:800;font-family:inherit;font-size:14px}
.atk-btns .yes{background:linear-gradient(135deg,#2f7d4a,#1f5c36);border-color:#4cc27a}
.atk-btns .no{background:linear-gradient(135deg,#8a2f3a,#5f1f28);border-color:#e0707e}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#0a1d15;border:1px solid #2a5c45;border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:18px;color:#ffc46b}.stat span{font-size:11px;color:#bfe3cf}
.q-card{border-color:#ffc46b!important}
.q-text{font-size:17px;font-weight:800;line-height:2;margin:6px 0 10px}
.q-bar{height:8px;border-radius:99px;background:#0a1d15;overflow:hidden;margin-bottom:12px}
.q-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffc46b,#ff7a59);transition:width 1s linear}
.opt{display:block;width:100%;text-align:right;margin-top:8px;padding:13px;border-radius:14px;border:1px solid #4c9a73;background:#153a2b;color:#fff;font-weight:800;font-size:15px;font-family:inherit}
.opt:disabled{opacity:.55}
.topic{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding:12px;border-radius:14px;border:1px solid #2a5c45;background:#0a1d15}
.topic .go{padding:9px 14px;border-radius:12px;border:0;font-weight:900;font-family:inherit;background:linear-gradient(135deg,#34d399,#059669);color:#fff}
.topic .go:disabled{opacity:.45}
.topic .lock{background:linear-gradient(135deg,#c28a1d,#8a5a0f)}
.wheel-wrap{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:8px auto 14px}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #ffc46b;box-shadow:0 0 0 4px #2a5c45,0 0 40px #3be0a0aa;transition:transform 5s cubic-bezier(.12,.67,.1,1)}
.wheel .lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel .lbl span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px #000a;white-space:nowrap}
.wheel-hub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(#ffe29a,#ffb347);border:3px solid #fff3;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:3;box-shadow:0 4px 14px #0008}
.wheel-pin{position:absolute;top:-14px;left:50%;margin-left:-14px;z-index:4;font-size:30px;filter:drop-shadow(0 2px 4px #000a)}
.spin-btn{width:100%;padding:15px;border-radius:16px;border:0;font-size:17px;font-weight:900;font-family:inherit;color:#fff;background:linear-gradient(135deg,#ff9a3c,#e0407e)}
.spin-btn:disabled{opacity:.5}
.wheel-res{text-align:center;font-size:18px;font-weight:900;color:#ffd27a;min-height:30px;margin-top:10px}
.chat-form{display:flex;gap:8px;margin-top:10px}
.chat-form input{flex:1;min-width:0;padding:12px;border-radius:14px;border:1px solid #4c9a73;background:#07150f;color:#fff;font-size:15px;font-family:inherit}
.chat-form .action{padding:0 18px}

.fox-name{font-size:22px;font-weight:800}
.muted{color:#a9d4bd;font-size:12px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
.chip{background:#143627;border:1px solid #3b7a5a;border-radius:999px;padding:6px 10px;font-size:12px}
.chip.skin{border-color:#ff9a3c;color:#ffb347}
.section-title{font-weight:800;margin:2px 0 10px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0a1d15;border-radius:14px;padding:11px;font-size:12px;color:#bfe3cf}
.stat b{display:block;font-size:16px;color:#ffb347;margin-top:4px}
.bar{height:8px;background:#0a1d15;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#ff9a3c;width:0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.action{border:0;border-radius:14px;padding:14px 8px;font-weight:800;font-size:14px;background:#ff9a3c;color:#1b120c;font-family:inherit}
.action.secondary{background:#1a4733;color:#f1fff6;border:1px solid #4c9a73}
.action.wide{grid-column:1/-1}
.action:active{transform:scale(.98)}.action:disabled{opacity:.5}
.banner{border-radius:14px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.9;text-align:center;display:none}
.banner.err{display:block;background:#3a1b1b;border:1px solid #7a3030}
.banner.ok{display:block;background:#1d3322;border:1px solid #3c7a4a}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:10px;background:#0a1d15;border:1px solid #2a5c45;border-radius:14px;padding:11px}
li.me{border-color:#ff9a3c;background:#1d4a35}
.rank{width:32px;text-align:center;font-weight:900}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.value{font-weight:900;color:#ffb347}
.filters{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:2px}
.filter{white-space:nowrap;border:1px solid #4c9a73;background:#153a2b;color:#eafff3;border-radius:999px;padding:8px 12px;font-family:inherit;font-size:13px}
.filter.active{background:#ff9a3c;color:#1b120c}
#msg{text-align:center;color:#cdeedb;padding:22px 10px;line-height:2}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal.open{display:flex}
.sheet{background:#0e271d;border:1px solid #3b7a5a;border-radius:20px;padding:18px;width:100%;max-width:360px}
.sheet h3{margin:0 0 12px;font-size:16px}
.sheet input{width:100%;padding:12px;border-radius:12px;border:1px solid #4c9a73;background:#07150f;color:#fff;font-size:15px;font-family:inherit}
.sheet .row{display:flex;gap:8px;margin-top:12px}.sheet .row .action{flex:1}

/* عنوان و کارت‌ها */
h1{letter-spacing:.5px;text-shadow:0 0 14px #3be0a0aa,0 2px 0 #0008}
.card{border-color:#2f6b4f;box-shadow:0 12px 32px #0008,inset 0 1px 0 #7af5e61a,0 0 0 1px #0b2219;position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,#7af5e60d,transparent 40%)}

/* دکمه‌های خوشگل */
.action{border:0;border-radius:16px;padding:14px 10px;font-weight:900;font-size:14.5px;color:#2a1204;
  background:linear-gradient(180deg,#ffc46b 0%,#ff9a3c 55%,#f27a22 100%);
  box-shadow:0 6px 18px #ff8a2a55,inset 0 1px 0 #fff8,inset 0 -3px 0 #c9601a;text-shadow:0 1px 0 #ffffff66;
  transition:transform .12s ease,box-shadow .12s ease,filter .2s}
.action:hover{filter:brightness(1.06)}
.action:active{transform:translateY(2px) scale(.985);box-shadow:0 2px 8px #ff8a2a44,inset 0 1px 0 #fff6,inset 0 -1px 0 #c9601a}
.action.secondary{color:#eafff3;text-shadow:none;background:linear-gradient(180deg,#236b50,#154433);border:1px solid #3fae83;
  box-shadow:0 5px 14px #0009,inset 0 1px 0 #7af5e633,inset 0 -3px 0 #0c2a1f}
.action.secondary:active{box-shadow:0 2px 6px #0009,inset 0 1px 0 #7af5e622,inset 0 -1px 0 #0c2a1f}
.opt{background:linear-gradient(180deg,#1d5a43,#12392b);border:1px solid #3fae83;border-radius:16px;
  box-shadow:0 4px 12px #0008,inset 0 1px 0 #7af5e62a;transition:transform .12s,filter .2s}
.opt:active{transform:scale(.985)}.opt:hover:not(:disabled){filter:brightness(1.12)}
.topic .go{background:linear-gradient(180deg,#43e0a8,#0f9d6e);color:#032015;box-shadow:0 4px 12px #0f9d6e55,inset 0 1px 0 #fff7;border-radius:14px}
.topic .go:active{transform:scale(.97)}
.topic .lock{background:linear-gradient(180deg,#ffc46b,#c98a1f);color:#2a1204}
.spin-btn{background:linear-gradient(180deg,#ffc46b,#ff8a2a 55%,#e0407e);box-shadow:0 8px 24px #ff8a2a66,inset 0 1px 0 #fff8,inset 0 -4px 0 #a02a50;text-shadow:0 1px 2px #0006;
  transition:transform .12s}
.spin-btn:active{transform:translateY(2px) scale(.985)}
.filter{border-color:#3fae83;background:linear-gradient(180deg,#1d5a43,#12392b);box-shadow:inset 0 1px 0 #7af5e62a}
.filter.active{background:linear-gradient(180deg,#ffc46b,#ff9a3c);color:#2a1204;font-weight:800;box-shadow:0 4px 12px #ff8a2a55}
.atk-btns button{border-radius:16px;box-shadow:0 4px 12px #0009,inset 0 1px 0 #fff2;transition:transform .12s}.atk-btns button:active{transform:scale(.985)}

/* نوار پایین */
.chip.skin{box-shadow:0 0 8px #ff9a3c44}
.wheel{box-shadow:0 0 0 4px #1d4a35,0 0 28px #3be0a088}

.card{background:linear-gradient(165deg,#12392cdb,#0a2018e8);border-color:#2c6a50;
  box-shadow:0 8px 22px #0008,inset 0 1px 0 #9ff5dc2a}
.section-title{text-shadow:0 0 10px #3be0a077}

/* ===== کارت بازیکن + نوار سطح ===== */
.player{overflow:hidden}
.p-top{display:flex;align-items:center;gap:12px}
.p-avatar{width:58px;height:58px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;
  background:#12392c;border:2px solid #ffc46b;box-shadow:0 0 0 3px #0b2219,0 0 18px #ffb34777}
.p-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.p-meta{flex:1;min-width:0}
.p-name{font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl-badge{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(#ffd27a calc(var(--p)*1%),#173a2c 0);box-shadow:0 0 22px #ffb34766,inset 0 0 0 1px #ffffff22;transition:background .8s}
.lvl-in{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#1c4e3a,#0a2018);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl-in small{font-size:9px;color:#bfe3cf}.lvl-in b{font-size:20px;color:#ffd27a;text-shadow:0 0 10px #ffb347aa}
.xp-wrap{margin-top:14px}
.xp-track{position:relative;height:22px;border-radius:99px;background:#06140e;border:1px solid #2c6a50;overflow:hidden;box-shadow:inset 0 3px 8px #000c,0 0 14px #3be0a022}
.xp-fill{position:relative;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#10b981 0%,#7be36b 45%,#ffd27a 100%);box-shadow:0 0 16px #7be36baa,0 0 34px #ffd27a66,inset 0 2px 0 #ffffff66;overflow:hidden}
.xp-fill::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff00 0 10px,#ffffff26 10px 20px)}
.xp-spark{display:none}
.xp-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000c,0 0 8px #000a;z-index:2}
.xp-row{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:12px;color:#cdeedb}
.xp-row b{color:#ffd27a}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini{background:#0a1d15;border:1px solid #2a5c45;border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;color:#bfe3cf}
.mini b{display:block;font-size:15px;color:#ffe9a8;margin-top:2px}

/* ===== برق زدنِ دکمه‌ها: فقط وقتی کاربر روشون می‌زنه ===== */
button{position:relative;overflow:hidden;isolation:isolate;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button::after{content:"";position:absolute;top:-30%;bottom:-30%;left:0;width:38%;pointer-events:none;opacity:0;z-index:2;
  background:linear-gradient(105deg,transparent 0%,#ffffff00 20%,#ffffffd0 50%,#ffffff00 80%,transparent 100%);
  transform:translateX(-120%) skewX(-22deg)}
button.shine::after{animation:sheen .6s ease-out 1}
@keyframes sheen{0%{opacity:1;transform:translateX(-120%) skewX(-22deg)}100%{opacity:1;transform:translateX(380%) skewX(-22deg)}}
button:disabled::after,.lb-close::after{display:none}
@media (prefers-reduced-motion:reduce){button::after{display:none}}

/* ===== صحنه: کوهستان + رودخانه‌ی روان (سبک: ایستا + فقط transform) ===== */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict;transform:translateZ(0);
  background:linear-gradient(180deg,#040b17 0%,#0a1f3a 36%,#164463 60%,#0d3a40 100%)}
.sc-stars{position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:#fff;
  box-shadow:40px 60px #fff,120px 20px #fff,210px 90px #fffc,300px 40px #fff,360px 120px #fff9,80px 150px #fff9,170px 180px #fff,260px 210px #fff9,330px 260px #fff,20px 260px #fff9,150px 300px #fff6,240px 330px #fff9,60px 360px #fff6,110px 90px #fff9,190px 140px #fff6,350px 200px #fff8,25px 120px #fff6}
.sc-stars.s2{top:34px;left:23px;opacity:.7;animation:twk 5s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.25}to{opacity:.9}}
.sc-moon{position:absolute;top:calc(40px + env(safe-area-inset-top,0px));right:28px;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#fffdf0 0%,#f4e7b8 40%,#d8c88f 75%,#b9a66f 100%);
  box-shadow:0 0 26px 8px #fff3c455,0 0 80px 30px #bfe0ff22}
.sc-mount{position:absolute;left:0;right:0;bottom:21vh;width:100%;height:54vh}
.sc-river{position:absolute;left:0;right:0;bottom:0;height:27vh;overflow:hidden;
  background:linear-gradient(180deg,#0a2c38 0%,#0f4c5a 38%,#0b3b48 100%)}
.sc-river::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;z-index:3;background:linear-gradient(180deg,#05141b,#05141b00)}
.sc-glint{position:absolute;top:0;bottom:0;right:6px;width:92px;background:radial-gradient(ellipse 48% 85% at 50% 0,#fff2c066,transparent 72%);animation:glint 3.6s ease-in-out infinite alternate}
@keyframes glint{from{opacity:.45}to{opacity:1}}
.flow{position:absolute;left:0;width:calc(100% + 360px);background-repeat:repeat-x;will-change:transform;backface-visibility:hidden}
.flow.f1{top:0;height:34%;background-size:180px 100%;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='60' viewBox='0 0 180 60'%3E%3Cg fill='none' stroke='%23bfeaf5' stroke-width='1.4' stroke-linecap='round'%3E%3Cpath d='M0 14 Q22 8 45 14 T90 14 T135 14 T180 14' stroke-opacity='.55'/%3E%3Cpath d='M0 40 Q22 34 45 40 T90 40 T135 40 T180 40' stroke-opacity='.35'/%3E%3C/g%3E%3C/svg%3E");
  animation:flow1 13s linear infinite}
.flow.f2{top:30%;height:36%;background-size:240px 100%;opacity:.62;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='80' viewBox='0 0 240 80'%3E%3Cg fill='none' stroke='%23d4f3fb' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M0 16 Q30 8 60 16 T120 16 T180 16 T240 16' stroke-opacity='.6'/%3E%3Cpath d='M0 46 Q30 38 60 46 T120 46 T180 46 T240 46' stroke-opacity='.4'/%3E%3Cpath d='M0 70 Q30 64 60 70 T120 70 T180 70 T240 70' stroke-opacity='.3'/%3E%3C/g%3E%3C/svg%3E");

/* ===== بازی‌ها: گردونه + بمب 💥 (سبک: بدون انیمیشن بی‌نهایت) ===== */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid #2f6b4f;background:linear-gradient(180deg,#17402f,#0e281e);color:#eafff3;border-radius:14px;padding:11px 2px;font-weight:900;font-size:12px;font-family:inherit}

.bomb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.bomb-top b{color:#ffc46b}
/* بمب واقعیِ CSS؛ بدون ایموجی، سبک و بدون فایل خارجی */
.bomb-art{position:relative;width:38px;height:38px;display:block;margin:auto;border-radius:50%;background:radial-gradient(circle at 32% 28%,#5a5a5a 0 8%,#252525 24%,#070707 72%);box-shadow:inset -6px -7px 10px #0008,0 5px 10px #0008}
.bomb-art:before{content:"";position:absolute;width:12px;height:8px;right:3px;top:-3px;border-radius:50%;background:#151515;transform:rotate(-25deg)}
.bomb-art i{position:absolute;width:10px;height:3px;right:-7px;top:-8px;background:#9b6b32;transform:rotate(-42deg);border-radius:3px}
.bomb-art b{position:absolute;width:7px;height:7px;right:-9px;top:-12px;border-radius:50%;background:#ffb000;box-shadow:0 0 8px #ff5a00,0 0 15px #ffcf33;animation:fuse .45s infinite alternate}
.safe-mark{display:grid;place-items:center;width:34px;height:34px;border:2px solid #55d68a;border-radius:9px;color:#55d68a;font-size:25px;font-weight:900;line-height:1;background:#0c2b1d;box-shadow:0 0 12px #37d77a33}
.cell-question{font-size:26px;font-weight:900;opacity:.7}
@keyframes fuse{to{transform:scale(1.3);filter:brightness(1.5)}}
.bcell.boom .bomb-art{animation:bombPop .45s ease-out both;box-shadow:0 0 22px #ff4b00,0 0 50px #ffb000}
@keyframes bombPop{0%{transform:scale(.65);opacity:.4}65%{transform:scale(1.2)}100%{transform:scale(1)}}
.bomb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 12px;direction:ltr}
.bcell{aspect-ratio:1/1;border-radius:14px;border:1px solid #3b7a5a;background:linear-gradient(180deg,#1b4a37,#0f2c20);color:#eafff3;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0;transition:transform .1s}
.bcell:active:not(:disabled){transform:scale(.93)}
.bcell.safe{background:linear-gradient(180deg,#2fbf7a,#17794d);border-color:#7af5c0}
.bcell.boom{background:linear-gradient(180deg,#ff6a4d,#a32414);border-color:#ffb199}
.bcell.ghost{opacity:.55}
.bcell:disabled{opacity:1}
.bomb-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bomb-info .stat{background:#0a2018;border:1px solid #2c6a50;border-radius:12px;padding:8px 6px;text-align:center;font-size:11.5px;color:#a9d4bd}

.bomb-amt{display:flex;gap:8px;margin:8px 0}
.bomb-amt input{flex:1;min-width:0;border-radius:12px;border:1px solid #3b7a5a;background:#0a2018;color:#fff;padding:12px;font-size:16px;font-family:inherit;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:1px solid #3b7a5a;background:#153a2b;color:#eafff3;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;font-family:inherit}
.bsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bsteps div{background:#0a2018;border:1px solid #2c6a50;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;color:#a9d4bd}

/* پلینکو 🔴 */

.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.p-title{font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 18px #7c6cff66}

.p-board{border-radius:22px;background:#10132a;border:1px solid #2f3466;padding:8px 0 8px}
.p-board-top{display:flex;justify-content:space-between;color:#aeb4ec;font-weight:800;font-size:13px;padding:2px 14px 8px}
.p-wrap{position:relative}
.p-result{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-52%);background:linear-gradient(165deg,#1d2150f2,#0b0e24f7);border:1.5px solid #ffc93d;border-radius:22px;padding:16px 14px 12px;text-align:center;box-shadow:0 0 40px #000c,0 0 26px #ffc93d44;animation:prPop .35s cubic-bezier(.2,1.4,.4,1);backdrop-filter:blur(3px)}

.p-chip{padding:4px 9px;border-radius:10px;font-weight:900;font-size:12.5px;color:#fff}
.p-bet{border-radius:22px;background:#10132a;border:1px solid #2f3466;padding:14px}
.p-bet-top{display:flex;justify-content:space-between;align-items:center;color:#d6daf8;font-weight:800;margin-bottom:10px}

.p-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;direction:ltr}
.p-chips button{flex:0 0 auto;padding:11px 18px;border-radius:999px;border:1.5px solid #343a6e;background:#161a38;color:#fff;font-weight:900;font-family:inherit;font-size:14px}

.p-ctrl{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;margin-bottom:12px}

.prisk button.on{background:linear-gradient(135deg,#67e8f9,#60a5fa);color:#071426;border-color:#d6fbff;box-shadow:0 0 18px #38bdf855}
#pDrop{background:linear-gradient(135deg,#22d3ee,#3b82f6)!important;color:#071426!important;border:0;box-shadow:0 8px 22px #2563eb55;font-weight:950}

/* ===== نوار پایین جدید (شبیه مینی‌اپ‌های حرفه‌ای): پنل گرد + آیکون‌های سه‌بعدی + دکمه‌ی وسط برجسته ===== */
.topbar{display:flex;align-items:center;gap:8px;padding:2px 0 8px}

.refresh-tab.spin #rfIcon{animation:spin .8s linear infinite}

.ping{min-width:70px;height:34px;border-radius:999px;border:1px solid #3b2d7a;background:#150e36cc;color:#cfc6ee;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;direction:ltr;white-space:nowrap}

.ping.bad i{background:#ff5d6c;box-shadow:0 0 8px #ff5d6c99}
.updated{text-align:center;color:#7fb39a;font-size:11px;margin:-4px 0 8px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:end;gap:0;
  padding:12px 6px calc(20px + env(safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#2f2068f5 0%,#190f40fa 100%);border-radius:28px 28px 0 0;border-top:2px solid #6f56cc99;
  box-shadow:0 -10px 32px #000a,inset 0 2px 0 #ffffff24}
.tab{position:relative;overflow:visible;background:none;border:0;box-shadow:none;border-radius:16px;padding:2px 0 0;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;color:#b9b0d6;font-weight:800;font-family:inherit;
  font-size:12px;line-height:1.25;min-width:0;transition:color .2s,transform .12s}
.tab::after{display:none!important}
.tab .ico{width:40px;height:40px;display:block;filter:drop-shadow(0 5px 5px #000a);transition:transform .25s cubic-bezier(.3,1.5,.5,1),filter .25s}
.tab:active .ico{transform:scale(.88)}
.tab.active{color:#ffd45e}
.tab.active .ico{transform:translateY(-5px) scale(1.15);filter:drop-shadow(0 0 9px #ffc94dbb) drop-shadow(0 6px 5px #000b)}
.tab.active::before{content:"";position:absolute;bottom:-6px;width:22px;height:4px;border-radius:4px;background:#ffd45e;box-shadow:0 0 10px #ffc94d}
.tab.center{color:#ffd45e;font-size:14px;font-weight:900;gap:5px}
.tab.center .cav{width:68px;height:68px;margin-top:-42px;border-radius:50%;border:3px solid #e6c36f;overflow:hidden;
  background:radial-gradient(circle at 50% 28%,#6a4bd0,#2a1a63);display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:0 0 0 4px #190f40,0 10px 20px #000b,0 0 18px #ffc94d44;transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.tab.center .cav img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.tab.center.active .cav{transform:translateY(-3px) scale(1.07);box-shadow:0 0 0 4px #190f40,0 12px 22px #000c,0 0 26px #ffc94d99}
.tab.center:active .cav{transform:scale(.94)}
.tab.center.active::before{display:none}
#cName{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}

/* ===== عنوان گیفت‌ها: روباه نقاش (فقط transform/opacity/clip-path؛ بدون لگ) ===== */
.fox-head{display:flex;justify-content:center;margin:2px 0 14px}
.fox-title{position:relative;display:inline-block;padding:14px 0 4px 62px;min-height:52px}
.gift-head .fox-text{margin:0;font-size:25px;font-weight:900;line-height:1.5;white-space:nowrap;background:linear-gradient(90deg,#ffe28a,#ffb03a 55%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;clip-path:inset(-10px 0 -10px 100%);animation:foxText 9s cubic-bezier(.45,.05,.4,1) infinite;will-change:clip-path}
.fox-mover{position:absolute;top:0;bottom:0;left:62px;right:0;pointer-events:none;animation:foxMove 9s cubic-bezier(.45,.05,.4,1) infinite;will-change:transform}
.fox-fade{position:absolute;right:-4px;top:-5px;width:57px;height:48px;animation:foxFade 9s linear infinite}
.fox-bob{position:relative;width:100%;height:100%;animation:foxBob .5s ease-in-out infinite alternate}
.fox-svg{width:100%;height:100%;display:block;overflow:visible}
.fox-tail{transform-box:fill-box;transform-origin:90% 90%;animation:foxTail .9s ease-in-out infinite alternate}
.fox-eyes{transform-box:fill-box;transform-origin:center;animation:foxBlink 3.2s infinite}
.fox-pen{transform-box:fill-box;transform-origin:15% 15%;animation:foxPen .28s ease-in-out infinite alternate}
.fox-spark{position:absolute;right:-3px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd45a 45%,rgba(255,180,40,0) 72%);animation:foxSpark .22s ease-in-out infinite alternate}
@keyframes foxText{0%,5%{clip-path:inset(-10px 0 -10px 100%);opacity:1}38%,90%{clip-path:inset(-10px 0 -10px 0);opacity:1}97%{clip-path:inset(-10px 0 -10px 0);opacity:0}100%{clip-path:inset(-10px 0 -10px 100%);opacity:0}}
@keyframes foxMove{0%,5%{transform:translate3d(0,0,0)}38%,100%{transform:translate3d(-100%,0,0)}}
@keyframes foxFade{0%{opacity:0}3%,90%{opacity:1}97%,100%{opacity:0}}
@keyframes foxBob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes foxTail{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes foxBlink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes foxPen{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes foxSpark{from{transform:scale(.6);opacity:.5}to{transform:scale(1.25);opacity:1}}
@media (prefers-reduced-motion:reduce){.fox-text{animation:none;clip-path:none}.fox-mover{animation:none;transform:translate3d(-100%,0,0)}.fox-fade{animation:none}.fox-bob,.fox-tail,.fox-eyes,.fox-pen,.fox-spark{animation:none}}
